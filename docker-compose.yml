services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - bot-data:/app/.data
      # Shared Smile.one session (bot writes; web Admin → Supplier reads)
      # Set SMILE_SESSION_PATH=/data/smileone/smileone_session.json
      - /data/smileone:/data/smileone
      # Shared merchant sessions (READ-ONLY here).
      # Writer: Donimate Payment Manager only.
      # Set KBZ_SESSION_PATH=/data/kbz/kbz_session.json
      # Set WAVE_SESSION_PATH=/data/wave/wave_session.json
      - /data/kbz:/data/kbz
      - /data/wave:/data/wave
      # Shop payment ON/OFF catalog (READ-ONLY; Payment Manager writes)
      # Set SHOP_PAYMENT_ACCOUNTS_PATH=/data/payments/shop_payment_accounts.json
      - /data/payments:/data/payments
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python bot/main.py' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  bot-data:

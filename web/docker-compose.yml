services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    volumes:
      # Shop orders, packages overrides, uploaded logos
      - web-data:/app/data
      # Shared Smile.one session (READ-ONLY). Bot writes this file.
      # Host once: sudo mkdir -p /data/smileone && copy smileone_session.json here
      # Set SMILE_SESSION_PATH=/data/smileone/smileone_session.json
      - /data/smileone:/data/smileone:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  web-data:
